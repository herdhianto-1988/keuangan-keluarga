<!DOCTYPE html>
<html>
<head>
  <title>Test API</title>
</head>
<body>

<button onclick="kirimData()">
  Kirim Transaksi
</button>

<script>

async function kirimData() {

  const data = {
    tanggal: "2026-05-21",
    akun: "Kas Tunai",
    deskripsi: "Test transaksi",
    masuk: 100000,
    keluar: 0
  };

  try {

    await fetch(
      "https://script.google.com/macros/s/AKfycbyExhVBuyp3FilTFDNw-B5VmkaBeiVr-_pS8yscekztGbgqXQSTK0G95MZ1ILcFSxJPlw/exec",
      {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      }
    );

    alert("Transaksi berhasil dikirim");

  } catch(err) {

    console.log(err);

    alert("Gagal mengirim transaksi");

  }

}

</script>

</body>
</html>
