<!DOCTYPE html>
<html>
<head>
  <title>Test API</title>
</head>
<body>

<button onclick="kirimData()">
  Kirim Transaksi
</button>

<script>

async function kirimData() {

  const url =
    "https://script.google.com/macros/s/AKfycbyExhVBuyp3FilTFDNw-B5VmkaBeiVr-_pS8yscekztGbgqXQSTK0G95MZ1ILcFSxJPlw/exec" +
    "?action=simpan" +
    "&tanggal=2026-05-21" +
    "&akun=Kas Tunai" +
    "&deskripsi=Test transaksi" +
    "&masuk=100000" +
    "&keluar=0";

  try {

    const response = await fetch(url);

    const hasil = await response.json();

    console.log(hasil);

    alert(hasil.pesan);

  } catch(err) {

    console.log(err);

    alert("Gagal");

  }

}

</script>

</body>
</html>
